version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "skip issue"
      - "skip news"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    cooldown:
      # https://blog.yossarian.net/2025/11/21/We-should-all-be-using-dependency-cooldowns
      # Cooldowns protect against supply chain attacks by avoiding the
      # highest-risk window immediately after new releases.
      default-days: 14
    rebase-strategy: auto
    target-branch: "main"
    commit-message:
      prefix: ""
      include: scope
    groups:
      github-actions:
        patterns:
          - ".*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "skip issue"
      - "skip news"
    cooldown:
      default-days: 14
    rebase-strategy: auto
    target-branch: "3.14"
    commit-message:
      prefix: "[3.14]"
      include: scope
    groups:
      github-actions:
        patterns:
          - ".*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "skip issue"
      - "skip news"
    cooldown:
      default-days: 14
    rebase-strategy: auto
    target-branch: "3.13"
    commit-message:
      prefix: "[3.13]"
      include: scope
    groups:
      github-actions:
        patterns:
          - ".*"
  - package-ecosystem: "pip"
    directory: "/Tools/"
    schedule:
      interval: "weekly"
    labels:
      - "skip issue"
      - "skip news"
    cooldown:
      default-days: 14
    rebase-strategy: auto
    target-branch: "main"
    commit-message:
      prefix: ""
      include: scope
    groups:
      pip-updates:
        patterns:
          - ".*"
  - package-ecosystem: "pip"
    directory: "/Tools/"
    schedule:
      interval: "weekly"
    labels:
      - "skip issue"
      - "skip news"
    cooldown:
      default-days: 14
    rebase-strategy: auto
    target-branch: "3.14"
    commit-message:
      prefix: "[3.14]"
      include: scope
    groups:
      pip-updates:
        patterns:
          - ".*"
  - package-ecosystem: "pip"
    directory: "/Tools/"
    schedule:
      interval: "weekly"
    labels:
      - "skip issue"
      - "skip news"
    cooldown:
      default-days: 14
    rebase-strategy: auto
    target-branch: "3.13"
    commit-message:
      prefix: "[3.13]"
      include: scope
    groups:
      pip-updates:
        patterns:
          - ".*"
